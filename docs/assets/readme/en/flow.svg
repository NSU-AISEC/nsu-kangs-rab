<?xml version="1.0" encoding="UTF-8"?>
<svg class="flow-root" width="972" height="332" viewBox="0 0 972 332" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-en-title flow-en-desc">
  <title id="flow-en-title">Prof. Kang's RAB flow</title>
  <desc id="flow-en-desc">Lecture or meeting audio (system sound) is transcribed live on your Mac in your chosen language, reaches the transcript screen for reflection ([Reflect], F2 or slash commands), is assembled with prior knowledge and screen captures into context, is sent to Claude (your subscription or API key), and the answer, reflection or summary is read and judged by you.</desc>
  <defs>
    <style>
      .flow-root { --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --soft:#7a8399; --rule:#2d3142; --rule-op:0.10; --accent:#eb6c36; --accent-op:0.08; --step:#ffffff; --input:#4f5d75; --input-op:0.10; }
      @media (prefers-color-scheme: dark) {
        .flow-root { --paper:#2d3142; --ink:#f5f5f5; --muted:#bfc0c0; --soft:#8e98ac; --rule:#f5f5f5; --rule-op:0.12; --accent:#f08a59; --accent-op:0.10; --step:#393e53; --input:#bfc0c0; --input-op:0.10; }
      }
      .flow-paper { fill: var(--paper); }
      .flow-step { fill: var(--step); stroke: var(--ink); }
      .flow-input { fill: var(--input); fill-opacity: var(--input-op); stroke: var(--soft); }
      .flow-focal { fill: var(--accent); fill-opacity: var(--accent-op); stroke: var(--accent); }
      .flow-conn { fill: none; stroke: var(--muted); }
      .flow-mk { fill: var(--muted); }
      .flow-rule { stroke: var(--rule); stroke-opacity: var(--rule-op); }
      .flow-name { fill: var(--ink); }
      .flow-sub { fill: var(--muted); }
      .flow-legend { fill: var(--muted); }
    </style>
    <marker id="flow-en-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="flow-mk" points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
  </defs>
  <g font-family="'Geist', system-ui, sans-serif" text-anchor="middle">
    <rect class="flow-paper" width="972" height="332" fill="#f5f5f5"/>
    <path class="flow-conn" d="M240,72 H272" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#flow-en-arrow)"/>
    <path class="flow-conn" d="M448,72 H480" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#flow-en-arrow)"/>
    <path class="flow-conn" d="M184,200 H216" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#flow-en-arrow)"/>
    <path class="flow-conn" d="M448,200 H480" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#flow-en-arrow)"/>
    <path class="flow-conn" d="M664,200 H696" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#flow-en-arrow)"/>
    <path class="flow-conn" d="M596,104 V128 Q596,136 588,136 H340 Q332,136 332,144 V168" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#flow-en-arrow)"/>
    <rect class="flow-paper" x="40" y="40" width="200" height="64" rx="6" fill="#f5f5f5"/>
    <rect class="flow-input" x="40" y="40" width="200" height="64" rx="6" fill="#4f5d75" fill-opacity="0.10" stroke="#7a8399" stroke-width="1"/>
    <text class="flow-name" x="140" y="76" fill="#2d3142" font-size="12" font-weight="600">Lecture · meeting audio</text>
    <text class="flow-sub" x="140" y="92" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">system sound</text>
    <rect class="flow-paper" x="272" y="40" width="176" height="64" rx="6" fill="#f5f5f5"/>
    <rect class="flow-step" x="272" y="40" width="176" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text class="flow-name" x="360" y="76" fill="#2d3142" font-size="12" font-weight="600">Live transcription</text>
    <text class="flow-sub" x="360" y="92" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">on your Mac · your language</text>
    <rect class="flow-paper" x="480" y="40" width="232" height="64" rx="6" fill="#f5f5f5"/>
    <rect class="flow-step" x="480" y="40" width="232" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text class="flow-name" x="596" y="76" fill="#2d3142" font-size="12" font-weight="600">Transcript screen · reflect</text>
    <text class="flow-sub" x="596" y="92" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">[Reflect] · F2 · slash commands</text>
    <rect class="flow-paper" x="40" y="168" width="144" height="64" rx="6" fill="#f5f5f5"/>
    <rect class="flow-input" x="40" y="168" width="144" height="64" rx="6" fill="#4f5d75" fill-opacity="0.10" stroke="#7a8399" stroke-width="1"/>
    <text class="flow-name" x="112" y="204" fill="#2d3142" font-size="12" font-weight="600">Prior knowledge</text>
    <text class="flow-sub" x="112" y="220" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">screen capture</text>
    <rect class="flow-paper" x="216" y="168" width="232" height="64" rx="6" fill="#f5f5f5"/>
    <rect class="flow-focal" x="216" y="168" width="232" height="64" rx="6" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1.2"/>
    <text class="flow-name" x="332" y="204" fill="#2d3142" font-size="12" font-weight="600">Context assembly</text>
    <text class="flow-sub" x="332" y="220" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">transcript + prior knowledge + screen</text>
    <rect class="flow-paper" x="480" y="168" width="184" height="64" rx="6" fill="#f5f5f5"/>
    <rect class="flow-focal" x="480" y="168" width="184" height="64" rx="6" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1.2"/>
    <text class="flow-name" x="572" y="204" fill="#2d3142" font-size="12" font-weight="600">Claude</text>
    <text class="flow-sub" x="572" y="220" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">your subscription or API key</text>
    <rect class="flow-paper" x="696" y="168" width="236" height="64" rx="6" fill="#f5f5f5"/>
    <rect class="flow-step" x="696" y="168" width="236" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text class="flow-name" x="814" y="204" fill="#2d3142" font-size="12" font-weight="600">Answer · reflection · summary</text>
    <text class="flow-sub" x="814" y="220" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">you read and judge</text>
    <line class="flow-rule" x1="40" y1="284" x2="932" y2="284" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
    <text class="flow-legend" x="40" y="300" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em" text-anchor="start">LEGEND</text>
    <rect class="flow-input" x="40" y="312" width="14" height="10" rx="2" fill="#4f5d75" fill-opacity="0.10" stroke="#7a8399" stroke-width="1"/>
    <text class="flow-legend" x="60" y="320" fill="#4f5d75" font-size="8.5" text-anchor="start">Input</text>
    <rect class="flow-step" x="140" y="312" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text class="flow-legend" x="160" y="320" fill="#4f5d75" font-size="8.5" text-anchor="start">Step</text>
    <rect class="flow-focal" x="240" y="312" width="14" height="10" rx="2" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1.2"/>
    <text class="flow-legend" x="260" y="320" fill="#4f5d75" font-size="8.5" text-anchor="start">Focal</text>
  </g>
</svg>
