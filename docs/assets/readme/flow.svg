<?xml version="1.0" encoding="UTF-8"?>
<svg class="flow-root" width="972" height="332" viewBox="0 0 972 332" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title flow-desc">
  <title id="flow-title">Prof. Kang's RAB 동작 흐름</title>
  <desc id="flow-desc">강의 · 회의 음성(시스템 사운드)이 내 맥 안에서 고른 언어로 실시간 전사되어 전사 화면 · 고찰([고찰] · F2 · 슬래시 명령)로 이어지고, 사전 지식 · 화면 캡처와 함께 맥락으로 구성되어 Claude(내 구독 또는 API 키)에 전달되며, 그 답변 · 고찰 · 요약을 내가 읽고 판단한다.</desc>
  <defs>
    <style>
      .flow-root { --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --soft:#7a8399; --rule:#2d3142; --rule-op:0.10; --accent:#eb6c36; --accent-op:0.08; --step:#ffffff; --input:#4f5d75; --input-op:0.10; }
      @media (prefers-color-scheme: dark) {
        .flow-root { --paper:#2d3142; --ink:#f5f5f5; --muted:#bfc0c0; --soft:#8e98ac; --rule:#f5f5f5; --rule-op:0.12; --accent:#f08a59; --accent-op:0.10; --step:#393e53; --input:#bfc0c0; --input-op:0.10; }
      }
      .flow-paper { fill: var(--paper); }
      .flow-step { fill: var(--step); stroke: var(--ink); }
      .flow-input { fill: var(--input); fill-opacity: var(--input-op); stroke: var(--soft); }
      .flow-focal { fill: var(--accent); fill-opacity: var(--accent-op); stroke: var(--accent); }
      .flow-conn { fill: none; stroke: var(--muted); }
      .flow-mk { fill: var(--muted); }
      .flow-rule { stroke: var(--rule); stroke-opacity: var(--rule-op); }
      .flow-name { fill: var(--ink); }
      .flow-sub { fill: var(--muted); }
      .flow-legend { fill: var(--muted); }
    </style>
    <marker id="flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="flow-mk" points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
  </defs>
  <g font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">
    <rect class="flow-paper" width="972" height="332" fill="#f5f5f5"/>
    <path class="flow-conn" d="M240,72 H272" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#flow-arrow)"/>
    <path class="flow-conn" d="M448,72 H480" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#flow-arrow)"/>
    <path class="flow-conn" d="M184,200 H216" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#flow-arrow)"/>
    <path class="flow-conn" d="M448,200 H480" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#flow-arrow)"/>
    <path class="flow-conn" d="M664,200 H696" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#flow-arrow)"/>
    <path class="flow-conn" d="M596,104 V128 Q596,136 588,136 H340 Q332,136 332,144 V168" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#flow-arrow)"/>
    <rect class="flow-paper" x="40" y="40" width="200" height="64" rx="6" fill="#f5f5f5"/>
    <rect class="flow-input" x="40" y="40" width="200" height="64" rx="6" fill="#4f5d75" fill-opacity="0.10" stroke="#7a8399" stroke-width="1"/>
    <text class="flow-name" x="140" y="76" fill="#2d3142" font-size="12" font-weight="600">강의 · 회의 음성</text>
    <text class="flow-sub" x="140" y="92" fill="#4f5d75" font-size="10">시스템 사운드</text>
    <rect class="flow-paper" x="272" y="40" width="176" height="64" rx="6" fill="#f5f5f5"/>
    <rect class="flow-step" x="272" y="40" width="176" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text class="flow-name" x="360" y="76" fill="#2d3142" font-size="12" font-weight="600">실시간 전사</text>
    <text class="flow-sub" x="360" y="92" fill="#4f5d75" font-size="10">내 맥 안 · 고른 언어</text>
    <rect class="flow-paper" x="480" y="40" width="232" height="64" rx="6" fill="#f5f5f5"/>
    <rect class="flow-step" x="480" y="40" width="232" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text class="flow-name" x="596" y="76" fill="#2d3142" font-size="12" font-weight="600">전사 화면 · 고찰</text>
    <text class="flow-sub" x="596" y="92" fill="#4f5d75" font-size="10">[고찰] · F2 · 슬래시 명령</text>
    <rect class="flow-paper" x="40" y="168" width="144" height="64" rx="6" fill="#f5f5f5"/>
    <rect class="flow-input" x="40" y="168" width="144" height="64" rx="6" fill="#4f5d75" fill-opacity="0.10" stroke="#7a8399" stroke-width="1"/>
    <text class="flow-name" x="112" y="204" fill="#2d3142" font-size="12" font-weight="600">사전 지식</text>
    <text class="flow-sub" x="112" y="220" fill="#4f5d75" font-size="10">화면 캡처</text>
    <rect class="flow-paper" x="216" y="168" width="232" height="64" rx="6" fill="#f5f5f5"/>
    <rect class="flow-focal" x="216" y="168" width="232" height="64" rx="6" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1.2"/>
    <text class="flow-name" x="332" y="204" fill="#2d3142" font-size="12" font-weight="600">맥락 구성</text>
    <text class="flow-sub" x="332" y="220" fill="#4f5d75" font-size="10">전사 + 사전 지식 + 화면</text>
    <rect class="flow-paper" x="480" y="168" width="184" height="64" rx="6" fill="#f5f5f5"/>
    <rect class="flow-focal" x="480" y="168" width="184" height="64" rx="6" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1.2"/>
    <text class="flow-name" x="572" y="204" fill="#2d3142" font-size="12" font-weight="600">Claude</text>
    <text class="flow-sub" x="572" y="220" fill="#4f5d75" font-size="10">내 구독 또는 API 키</text>
    <rect class="flow-paper" x="696" y="168" width="236" height="64" rx="6" fill="#f5f5f5"/>
    <rect class="flow-step" x="696" y="168" width="236" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text class="flow-name" x="814" y="204" fill="#2d3142" font-size="12" font-weight="600">답변 · 고찰 · 요약</text>
    <text class="flow-sub" x="814" y="220" fill="#4f5d75" font-size="10">내가 읽고 판단</text>
    <line class="flow-rule" x1="40" y1="284" x2="932" y2="284" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
    <text class="flow-legend" x="40" y="300" fill="#4f5d75" font-size="9" text-anchor="start">범례</text>
    <rect class="flow-input" x="40" y="312" width="14" height="10" rx="2" fill="#4f5d75" fill-opacity="0.10" stroke="#7a8399" stroke-width="1"/>
    <text class="flow-legend" x="60" y="320" fill="#4f5d75" font-size="8.5" text-anchor="start">입력</text>
    <rect class="flow-step" x="140" y="312" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text class="flow-legend" x="160" y="320" fill="#4f5d75" font-size="8.5" text-anchor="start">단계</text>
    <rect class="flow-focal" x="240" y="312" width="14" height="10" rx="2" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1.2"/>
    <text class="flow-legend" x="260" y="320" fill="#4f5d75" font-size="8.5" text-anchor="start">핵심</text>
  </g>
</svg>
