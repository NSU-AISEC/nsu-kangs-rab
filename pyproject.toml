[project]
name = "nsu-kangs-rab"
version = "0.1.0"
description = "강의·회의 음성을 실시간 전사하고 자료 · 화면과 함께 Claude 에 질의하는 앱"
readme = "README.md"
authors = [
    { name = "aidanpark" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "scipy>=1.18.1",
    "pypdf[crypto]>=6.19.0",
    "sounddevice>=0.5.6",
    "keyring>=25.0.0",
    "PySide6==6.12.0",
]

[project.scripts]
nsu-kangs-rab = "nsu_kangs_rab:main"

# 플랫폼별 소스를 src/mac · src/windows 로 구분한다. 현재 빌드 대상은 macOS 이다 (docs/adr/0000-decisions-2026-10-07.md (macOS 1차 행)).
[tool.uv.build-backend]
module-root = "src/mac"

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"
